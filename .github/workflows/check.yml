name: Check for new releases

on:
  schedule:
    - cron: '0 2 1,15 * *'  # 1st and 15th at 2 AM
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  check-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check and trigger
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            // 1. Fetch the latest release from the upstream repo
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: 'ptitSeb',
              repo: 'box64'
            });
            const latestTag = release.tag_name;
            console.log(`Latest upstream release: ${latestTag}`);

            // 2. Read current builds.json (or create a default one)
            const buildsPath = path.join(process.env.GITHUB_WORKSPACE, 'builds.json');
            let builds = { builds: [], last_checked: '' };
            if (fs.existsSync(buildsPath)) {
              try {
                builds = JSON.parse(fs.readFileSync(buildsPath, 'utf8'));
              } catch (e) {
                console.warn('Invalid builds.json, resetting to default');
              }
            }

            // 3. Check if this version was already built
            const alreadyBuilt = builds.builds.some(b => b.version === latestTag);
            const now = new Date().toISOString();

            // 4. Always update last_checked; add the new version if missing
            if (!alreadyBuilt) {
              builds.builds.push({ version: latestTag, built_at: now });
              console.log(`✅ New version detected: ${latestTag}`);
            } else {
              console.log(`⏭️  Version ${latestTag} already built, skipping trigger`);
            }
            builds.last_checked = now;

            // 5. Write the updated JSON back to disk
            fs.writeFileSync(buildsPath, JSON.stringify(builds, null, 2));

            // 6. Commit and push builds.json (only if changed)
            try {
              execSync('git config user.name "github-actions[bot]"');
              execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
              execSync('git add builds.json');
              // This throws if there's nothing to commit (no changes)
              execSync('git commit -m "Update builds.json for ' + latestTag + '"');
              
              // Push with retry (handles race conditions where someone pushed before us)
              for (let i = 0; i < 3; i++) {
                try {
                  execSync('git push origin HEAD:main --force-with-lease');
                  console.log('✅ builds.json pushed successfully');
                  break;
                } catch (pushErr) {
                  console.log(`Push attempt ${i + 1} failed, pulling latest changes...`);
                  execSync('git pull --rebase origin main');
                  if (i === 2) throw pushErr; // rethrow on final failure
                }
              }
            } catch (commitErr) {
              // No changes to commit – that's fine, means nothing new
              console.log('ℹ️  No changes to commit (builds.json already up to date)');
            }

            // 7. If this is a new version, trigger the build workflow
            if (!alreadyBuilt) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'build.yml',        // your existing build workflow filename
                ref: context.ref,                 // uses the same branch that triggered this check
                inputs: { version: latestTag }
              });
              console.log(`🚀 Triggered build workflow for ${latestTag}`);
            }