name: Check for new releases

on:
  schedule:
    - cron: '0 2 1,15 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  check-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check and trigger
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            // Get latest box64 release
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: 'ptitSeb',
              repo: 'box64'
            });
            const tag = release.tag_name;

            // Load build history
            const buildsPath = path.join(process.env.GITHUB_WORKSPACE, 'builds.json');
            let builds = { builds: [], last_checked: '' };
            if (fs.existsSync(buildsPath)) {
              try {
                builds = JSON.parse(fs.readFileSync(buildsPath, 'utf8'));
              } catch (e) {
                // If corrupt, start fresh
              }
            }

            // Check if we've built this version
            const known = builds.builds.some(b => b.version === tag);
            const now = new Date().toISOString();

            // Update history
            if (!known) {
              builds.builds.push({ version: tag, built_at: now });
            }
            builds.last_checked = now;
            fs.writeFileSync(buildsPath, JSON.stringify(builds, null, 2));

            // Push changes if any
            try {
              execSync('git config user.name "github-actions[bot]"');
              execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
              execSync('git add builds.json');
              execSync('git commit -m "builds.json: record ' + tag + '"');

              for (let i = 0; i < 3; i++) {
                try {
                  execSync('git push origin HEAD:main --force-with-lease');
                  break;
                } catch (e) {
                  if (i === 2) throw e;
                  execSync('git pull --rebase origin main');
                }
              }
            } catch (_) {
              // No changes, nothing to commit
            }

            // Trigger build workflow if new version
            if (!known) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'build.yml',
                ref: context.ref,
                inputs: { version: tag }
              });
            }